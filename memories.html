<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Воспоминания | 2V Психошка</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#f5f5f5;
    background:#050505;
    min-height:100vh;
    overflow-x:hidden;
}

/* =====================================================
   FIXED BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;
    background-image:var(--bg);
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-9;
    background:rgba(0,0,0,.30);
    pointer-events:none;
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:2000;
    width:100%;
    background:rgba(5,5,5,.88);
    border-bottom:1px solid rgba(255,193,7,.35);
    backdrop-filter:blur(10px);
    box-shadow:0 5px 20px rgba(0,0,0,.22);
}

.nav{
    width:min(1050px,92%);
    min-height:65px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{color:#ff3030}

.nav-links{
    display:flex;
    align-items:center;
    gap:7px;
}

.nav-links a{
    color:#eee;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    padding:9px 13px;
    border-radius:8px;
    transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
    background:#ffc400;
    color:#050505;
}

/* =====================================================
   MAIN / SECTIONS
===================================================== */

main{
    position:relative;
    z-index:1;
    width:min(1000px,92%);
    margin:auto;
    padding:34px 0 120px;
}

.section{
    margin-bottom:22px;
    background:rgba(7,7,7,.80);
    border:1px solid rgba(255,193,7,.28);
    border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.28);
    backdrop-filter:blur(5px);
    overflow:hidden;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 18px 0;
    font-size:21px;
    font-weight:900;
}

.section-title::before{
    content:"";
    width:4px;
    height:23px;
    border-radius:5px;
    background:linear-gradient(#ff3030 0 50%,#ffc400 50% 100%);
}

/* =====================================================
   INTRO
===================================================== */

.intro{
    padding:18px;
}

.intro p{
    color:#aaa;
    font-size:13px;
    line-height:1.6;
    margin-top:9px;
}

/* =====================================================
   GUILD MEMORY SECTIONS
===================================================== */

.guild-section{
    margin-bottom:22px;
    padding-bottom:18px;
}

.guild-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 18px 14px;
}

.guild-heading h2{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
}

.guild-heading h2::before{
    content:"";
    width:4px;
    height:23px;
    border-radius:5px;
    background:linear-gradient(#ff3030 0 50%,#ffc400 50% 100%);
}

.photo-count{
    color:#777;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

/* =====================================================
   GALLERY
===================================================== */

.gallery{
    padding:0 18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.memory-card{
    position:relative;
    overflow:hidden;
    background:#050505;
    border:1px solid rgba(255,193,7,.24);
    border-radius:13px;
    box-shadow:0 7px 20px rgba(0,0,0,.30);
    cursor:pointer;
    isolation:isolate;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.memory-card:hover{
    transform:translateY(-4px);
    border-color:rgba(255,193,7,.70);
    box-shadow:0 12px 28px rgba(0,0,0,.45);
}

.memory-card img{
    width:100%;
    height:220px;
    display:block;
    object-fit:cover;
    transition:transform .35s ease;
}

.memory-card:hover img{
    transform:scale(1.035);
}

.memory-caption{
    padding:10px 11px 12px;
    background:linear-gradient(to bottom,rgba(10,10,10,.92),#080808);
}

.memory-caption h3{
    color:#ffc400;
    font-size:13px;
    margin-bottom:4px;
}

.memory-caption p{
    color:#999;
    font-size:10px;
    line-height:1.45;
}

.no-photos{
    margin:0 18px;
    padding:24px 12px;
    text-align:center;
    color:#666;
    font-size:12px;
    border:1px dashed #333;
    border-radius:11px;
}

/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:rgba(0,0,0,.90);
    backdrop-filter:blur(9px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease,visibility .22s ease;
}

.lightbox.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.lightbox-stage{
    position:relative;
    width:min(1100px,94vw);
    height:min(86vh,850px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
}

.lightbox-image{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:10px;
    user-select:none;
    -webkit-user-drag:none;
    cursor:grab;
    transform:translate3d(0,0,0) scale(1);
    transform-origin:center center;
    transition:transform .12s ease;
    box-shadow:0 10px 50px rgba(0,0,0,.55);
}

.lightbox-image.dragging{
    cursor:grabbing;
    transition:none;
}

.close-button{
    position:absolute;
    top:18px;
    right:20px;
    z-index:10;
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(15,15,15,.82);
    color:#fff;
    font-size:25px;
    line-height:1;
    cursor:pointer;
    transition:.2s;
}

.close-button:hover{
    background:#ffc400;
    color:#050505;
}

.zoom-controls{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:7px;
    padding:6px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:12px;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(10px);
}

.zoom-controls button{
    width:38px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#181818;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.zoom-controls button:hover{
    background:#ffc400;
    color:#050505;
}

.lightbox-caption{
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    max-width:min(700px,80vw);
    padding:7px 12px;
    border-radius:8px;
    background:rgba(0,0,0,.65);
    color:#ddd;
    font-size:11px;
    text-align:center;
    pointer-events:none;
}

.nav-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:46px;
    height:58px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    background:rgba(10,10,10,.72);
    color:#fff;
    font-size:30px;
    cursor:pointer;
    transition:.2s;
}

.nav-arrow:hover{
    background:#ffc400;
    color:#050505;
}

.prev-button{left:18px}
.next-button{right:18px}

/* =====================================================
   SOCIAL
===================================================== */

.social-bar{
    position:fixed;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    z-index:3000;
    display:flex;
    gap:7px;
    width:max-content;
    max-width:calc(100% - 20px);
}

.social-button{
    min-width:145px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:11px 14px;
    border-radius:9px;
    text-decoration:none;
    font-size:12px;
    font-weight:900;
    box-shadow:0 7px 22px rgba(0,0,0,.55);
}

.social-tiktok{
    background:#111;
    color:#fff;
    border:1px solid #444;
}

.social-whatsapp{
    background:#ffc400;
    color:#050505;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .nav{min-height:59px}

    .logo{font-size:17px}

    .nav-links{
        gap:3px;
        overflow-x:auto;
        scrollbar-width:none;
    }

    .nav-links::-webkit-scrollbar{display:none}

    .nav-links a{
        padding:7px 8px;
        font-size:10px;
        white-space:nowrap;
    }

    main{
        width:94%;
        padding-top:23px;
        padding-bottom:100px;
    }

    .section-title{
        font-size:18px;
        padding:14px 14px 0;
    }

    .section-title::before{
        height:20px;
    }

    .intro{
        padding:14px;
    }

    .intro p{
        font-size:11px;
        line-height:1.5;
    }

    .guild-section{
        border-radius:13px;
        margin-bottom:15px;
        padding-bottom:14px;
    }

    .guild-heading{
        padding:14px 14px 11px;
    }

    .guild-heading h2{
        font-size:17px;
    }

    .guild-heading h2::before{
        height:20px;
    }

    .photo-count{
        font-size:9px;
    }

    .gallery{
        padding:0 14px;
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .memory-card{
        border-radius:10px;
    }

    .memory-card img{
        height:145px;
    }

    .memory-caption{
        padding:8px 8px 9px;
    }

    .memory-caption h3{
        font-size:11px;
    }

    .memory-caption p{
        font-size:9px;
    }

    .no-photos{
        margin:0 14px;
    }

    .lightbox{
        padding:8px;
    }

    .lightbox-stage{
        width:100%;
        height:80vh;
    }

    .close-button{
        top:10px;
        right:10px;
        width:40px;
        height:40px;
    }

    .nav-arrow{
        width:38px;
        height:48px;
        font-size:24px;
    }

    .prev-button{left:7px}
    .next-button{right:7px}

    .lightbox-caption{
        bottom:62px;
        max-width:72vw;
        font-size:9px;
    }

    .zoom-controls{
        bottom:10px;
    }

    .zoom-controls button{
        width:34px;
        height:31px;
    }

    .social-button{
        min-width:135px;
        padding:10px;
        font-size:11px;
    }
}

@media(max-width:380px){

    .memory-card img{
        height:125px;
    }

    .social-button{
        min-width:125px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<header>
<nav class="nav">
    <div class="logo">
        <span>2V</span> Психошка
    </div>

    <div class="nav-links">
        <a href="about.html">Обо мне</a>
        <a href="index.html">Профиль</a>
        <a href="guild.html">2VN</a>
        <a href="memories.html" class="active">Воспоминания</a>
    </div>
</nav>
</header>

<main>

<section class="section">
    <h1 class="section-title">Воспоминания</h1>
    <div class="intro">
        <p>
            Фотографии из разных периодов игры и разных гильдий.
            Нажми на любую фотографию, чтобы открыть её в большом размере.
            Новые фотографии подхватываются автоматически из папки
            <strong style="color:#ffc400;">memories</strong>.
        </p>
    </div>
</section>

<div id="memorySections"></div>

</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close-button" id="closeButton" aria-label="Закрыть">×</button>
    <button class="nav-arrow prev-button" id="prevButton" aria-label="Предыдущая">‹</button>

    <div class="lightbox-stage" id="lightboxStage">
        <img class="lightbox-image" id="lightboxImage" alt="">
    </div>

    <button class="nav-arrow next-button" id="nextButton" aria-label="Следующая">›</button>

    <div class="lightbox-caption" id="lightboxCaption"></div>

    <div class="zoom-controls">
        <button id="zoomOut" aria-label="Уменьшить">−</button>
        <button id="zoomReset" aria-label="Сбросить">↺</button>
        <button id="zoomIn" aria-label="Увеличить">+</button>
    </div>
</div>

<div class="social-bar">
    <a class="social-button social-tiktok"
       href="https://www.tiktok.com/@erko_zr"
       target="_blank"
       rel="noopener noreferrer">
        🎵 TikTok @erko_zr
    </a>

    <a class="social-button social-whatsapp"
       href="https://wa.me/77053536952"
       target="_blank"
       rel="noopener noreferrer">
        💬 WhatsApp
    </a>
</div>

<script>
/* =====================================================
   BACKGROUND — SAME SYSTEM AS THE OTHER PAGES
===================================================== */

const pcBackgrounds=[
    "bg-pc-1.jpg",
    "bg-pc-2.jpg",
    "bg-pc-3.jpg",
    "bg-pc-4.jpg",
    "bg-pc-5.jpg"
];

const mobileBackgrounds=[
    "bg-mobile-1.jpg",
    "bg-mobile-2.jpg",
    "bg-mobile-3.jpg",
    "bg-mobile-4.jpg",
    "bg-mobile-5.jpg"
];

const backgrounds=window.innerWidth<=700
    ? mobileBackgrounds
    : pcBackgrounds;

const selected=backgrounds[
    Math.floor(Math.random()*backgrounds.length)
];

document.documentElement.style.setProperty(
    "--bg",
    `url("${selected}")`
);

/* =====================================================
   MEMORY GALLERIES
   GitHub Pages cannot list a folder by itself, so the
   public GitHub API is used to discover every image.
   Add files to /memories and they appear automatically.
===================================================== */

const GITHUB_OWNER="psihoshka";
const GITHUB_REPO="freefire-2vn";
const MEMORY_FOLDER="memories";

const groups=[
    {prefix:"2VN-", title:"2VN"},
    {prefix:"tt-", title:"The thugs !"},
    {prefix:"aq-", title:"Aiqyn Qadam"},
    {prefix:"nm-", title:"No Mercy"}
];

/*
   Optional descriptions.
   Add a filename here only when you want text under a photo.

   Example:
   descriptions["2VN-1.jpg"]="Первый момент с ребятами из 2VN.";
*/
const descriptions={
    // "2VN-1.jpg":"Описание этого воспоминания"
};

const imageExtensions=[".jpg",".jpeg",".png",".webp",".gif"];

let allMemories=[];
let currentIndex=0;
let zoom=1;
let posX=0;
let posY=0;
let dragging=false;
let dragStartX=0;
let dragStartY=0;
let startPosX=0;
let startPosY=0;

const sectionsContainer=document.getElementById("memorySections");
const lightbox=document.getElementById("lightbox");
const lightboxImage=document.getElementById("lightboxImage");
const lightboxCaption=document.getElementById("lightboxCaption");
const lightboxStage=document.getElementById("lightboxStage");

function isImage(name){
    const lower=name.toLowerCase();
    return imageExtensions.some(ext=>lower.endsWith(ext));
}

function naturalNumberSort(a,b){
    const aNum=parseInt(a.match(/(\d+)(?=\.[^.]+$)/)?.[1] || "0",10);
    const bNum=parseInt(b.match(/(\d+)(?=\.[^.]+$)/)?.[1] || "0",10);
    return aNum-bNum;
}

async function loadMemories(){

    sectionsContainer.innerHTML="";

    try{
        const response=await fetch(
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MEMORY_FOLDER}`,
            {
                headers:{
                    "Accept":"application/vnd.github+json"
                }
            }
        );

        if(!response.ok){
            throw new Error("GitHub API: "+response.status);
        }

        const files=await response.json();

        for(const group of groups){

            const groupFiles=files
                .filter(file =>
                    file.type==="file" &&
                    isImage(file.name) &&
                    file.name.toLowerCase().startsWith(group.prefix.toLowerCase())
                )
                .sort((a,b)=>naturalNumberSort(a.name,b.name));

            const section=document.createElement("section");
            section.className="section guild-section";

            const heading=document.createElement("div");
            heading.className="guild-heading";

            const title=document.createElement("h2");
            title.textContent=group.title;

            const count=document.createElement("div");
            count.className="photo-count";
            count.textContent=groupFiles.length+" фото";

            heading.append(title,count);
            section.appendChild(heading);

            if(groupFiles.length===0){
                const empty=document.createElement("div");
                empty.className="no-photos";
                empty.textContent="Фотографий пока нет";
                section.appendChild(empty);
            }else{
                const gallery=document.createElement("div");
                gallery.className="gallery";

                groupFiles.forEach(file=>{
                    const index=allMemories.length;

                    const memory={
                        name:file.name,
                        url:file.download_url,
                        group:group.title,
                        description:descriptions[file.name] || ""
                    };

                    allMemories.push(memory);

                    const card=document.createElement("article");
                    card.className="memory-card";
                    card.dataset.index=index;

                    const img=document.createElement("img");
                    img.src=file.download_url;
                    img.alt=descriptions[file.name] || group.title+" — "+file.name;
                    img.loading="lazy";

                    card.appendChild(img);

                    if(memory.description){
                        const caption=document.createElement("div");
                        caption.className="memory-caption";

                        const h3=document.createElement("h3");
                        h3.textContent=group.title;

                        const p=document.createElement("p");
                        p.textContent=memory.description;

                        caption.append(h3,p);
                        card.appendChild(caption);
                    }

                    card.addEventListener("click",()=>{
                        openLightbox(index);
                    });

                    gallery.appendChild(card);
                });

                section.appendChild(gallery);
            }

            sectionsContainer.appendChild(section);
        }

    }catch(error){

        console.error(error);

        const errorBox=document.createElement("div");
        errorBox.className="section";
        errorBox.innerHTML=`
            <div class="intro">
                <p style="color:#ff7070;">
                    Не удалось загрузить фотографии автоматически.
                    Проверь, что папка <strong>memories</strong> существует
                    в репозитории и содержит изображения.
                </p>
            </div>
        `;

        sectionsContainer.appendChild(errorBox);
    }
}

/* =====================================================
   LIGHTBOX
===================================================== */

function resetTransform(){
    zoom=1;
    posX=0;
    posY=0;
    applyTransform();
}

function applyTransform(){
    lightboxImage.style.transform=
        `translate3d(${posX}px,${posY}px,0) scale(${zoom})`;
}

function openLightbox(index){

    if(!allMemories.length) return;

    currentIndex=(index+allMemories.length)%allMemories.length;

    const memory=allMemories[currentIndex];

    lightboxImage.src=memory.url;
    lightboxImage.alt=memory.description || memory.group;
    lightboxCaption.textContent=
        memory.description
        ? `${memory.group} — ${memory.description}`
        : memory.group;

    resetTransform();

    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
}

function closeLightbox(){
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    resetTransform();
}

function changePhoto(direction){
    openLightbox(currentIndex+direction);
}

function changeZoom(amount){
    zoom=Math.min(4,Math.max(.5,zoom+amount));

    if(zoom===1){
        posX=0;
        posY=0;
    }

    applyTransform();
}

document.getElementById("closeButton").addEventListener("click",closeLightbox);
document.getElementById("prevButton").addEventListener("click",()=>changePhoto(-1));
document.getElementById("nextButton").addEventListener("click",()=>changePhoto(1));

document.getElementById("zoomIn").addEventListener("click",()=>changeZoom(.25));
document.getElementById("zoomOut").addEventListener("click",()=>changeZoom(-.25));
document.getElementById("zoomReset").addEventListener("click",resetTransform);

lightbox.addEventListener("click",event=>{
    if(event.target===lightbox){
        closeLightbox();
    }
});

document.addEventListener("keydown",event=>{

    if(!lightbox.classList.contains("open")) return;

    if(event.key==="Escape") closeLightbox();
    if(event.key==="ArrowLeft") changePhoto(-1);
    if(event.key==="ArrowRight") changePhoto(1);

    if(event.key==="+" || event.key==="=") changeZoom(.25);
    if(event.key==="-" || event.key==="_") changeZoom(-.25);
    if(event.key==="0") resetTransform();
});

/* Mouse wheel zoom */
lightboxStage.addEventListener("wheel",event=>{
    event.preventDefault();
    changeZoom(event.deltaY<0 ? .15 : -.15);
},{passive:false});

/* Drag image when zoomed */
lightboxImage.addEventListener("pointerdown",event=>{

    if(zoom<=1) return;

    dragging=true;

    lightboxImage.classList.add("dragging");
    lightboxImage.setPointerCapture(event.pointerId);

    dragStartX=event.clientX;
    dragStartY=event.clientY;

    startPosX=posX;
    startPosY=posY;
});

lightboxImage.addEventListener("pointermove",event=>{

    if(!dragging) return;

    posX=startPosX+(event.clientX-dragStartX);
    posY=startPosY+(event.clientY-dragStartY);

    applyTransform();
});

function stopDragging(){
    dragging=false;
    lightboxImage.classList.remove("dragging");
}

lightboxImage.addEventListener("pointerup",stopDragging);
lightboxImage.addEventListener("pointercancel",stopDragging);

/* Touch swipe for next/previous photo */
let touchStartX=0;

lightboxStage.addEventListener("touchstart",event=>{
    if(event.touches.length===1){
        touchStartX=event.touches[0].clientX;
    }
},{passive:true});

lightboxStage.addEventListener("touchend",event=>{

    if(event.changedTouches.length!==1 || zoom>1) return;

    const delta=event.changedTouches[0].clientX-touchStartX;

    if(Math.abs(delta)>60){
        changePhoto(delta>0 ? -1 : 1);
    }
},{passive:true});

loadMemories();
</script>

</body>
</html>
