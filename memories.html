<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    color:#fff;

    background:#050505;

    min-height:100vh;

    overflow-x:hidden;
}

/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";

    position:fixed;

    inset:0;

    z-index:-10;

    background-image:var(--bg);

    background-position:center;

    background-size:cover;

    background-repeat:no-repeat;
}

body::after{
    content:"";

    position:fixed;

    inset:0;

    z-index:-9;

    background:rgba(0,0,0,.38);

    pointer-events:none;
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;

    top:0;

    z-index:2000;

    width:100%;

    min-height:65px;

    background:rgba(5,5,5,.88);

    border-bottom:
        1px solid
        rgba(255,193,7,.35);

    backdrop-filter:blur(10px);
}

.nav{
    width:min(1050px,92%);

    min-height:65px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;
}

.logo{
    font-size:21px;

    font-weight:900;
}

.logo span{
    color:#ff3030;
}

/* =====================================================
   MAIN
===================================================== */

main{
    position:relative;

    z-index:1;

    width:min(1100px,92%);

    margin:auto;

    padding:34px 0 130px;
}

/* =====================================================
   PAGE INTRO
===================================================== */

.page-intro{
    margin-bottom:25px;

    padding:25px;

    background:rgba(7,7,7,.82);

    border:
        1px solid
        rgba(255,193,7,.28);

    border-radius:16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.30);

    backdrop-filter:blur(4px);
}

.page-intro h1{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:34px;

    margin-bottom:8px;
}

.page-intro h1::before{

    height:35px;

    border-radius:5px;

    background:

}

.page-intro p{

/* =====================================================
   GUILD SECTION
===================================================== */

.guild-section{

    background:rgba(7,7,7,.82);

    border:

    border-radius:16px;

    backdrop-filter:blur(4px);
}

.guild-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}

.guild-title-left{
    display:flex;

    align-items:center;

    gap:10px;
}

.guild-title-left::before{
    content:"";

    width:4px;

    height:24px;

    border-radius:5px;

    background:
        linear-gradient(
            #ff3030 0 50%,
            #ffc400 50% 100%

}

.guild-title h2{
    font-size:23px;
}

.guild-title h2 span{
    color:#ffc400;
}

.photo-count{
    padding:6px 10px;

    border-radius:8px;

    background:rgba(255,193,7,.10);

    border:
        1px solid
        rgba(255,193,7,.25);

    color:#ffc400;

    font-size:11px;

    font-weight:900;
}

/* =====================================================
   GALLERY
===================================================== */

.gallery{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:13px;
}

.photo-card{
    position:relative;

    overflow:hidden;

    min-height:190px;

    background:#050505;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:13px;

    cursor:pointer;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.30);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.photo-card:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,193,7,.55);

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.45);
}

.photo-card img{
    width:100%;

    height:100%;

    min-height:190px;

    display:block;

    object-fit:cover;

    transition:
        transform .35s ease,
        filter .35s ease;
}

.photo-card:hover img{
    transform:scale(1.05);

    filter:brightness(1.08);
}

.photo-number{
    position:absolute;

    left:8px;

    top:8px;

    padding:5px 7px;

    border-radius:6px;

    background:rgba(0,0,0,.72);

    color:#fff;

    font-size:10px;

    font-weight:900;

    pointer-events:none;
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading{
    grid-column:1/-1;

    padding:30px;

    text-align:center;

    color:#888;

    font-size:13px;
}

.empty{
    grid-column:1/-1;

    padding:28px;

    text-align:center;

    border:
        1px dashed
        rgba(255,255,255,.12);

    border-radius:11px;

    color:#777;

    font-size:12px;
}

.error{
    grid-column:1/-1;

    padding:25px;

    text-align:center;

    color:#ff7777;

    background:rgba(255,0,0,.06);

    border:
        1px solid
        rgba(255,0,0,.15);

    border-radius:10px;

    font-size:12px;

    line-height:1.5;
}

/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{
    position:fixed;

    inset:0;

    z-index:7000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:65px 70px;

    background:rgba(0,0,0,.94);

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.lightbox.open{
    opacity:1;

    visibility:visible;

    pointer-events:auto;
}

/* =====================================================
   LIGHTBOX STAGE
===================================================== */

.lightbox-stage{
    position:relative;

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    touch-action:none;
}

.lightbox-image{
    position:absolute;

    left:50%;

    top:50%;

    max-width:
        calc(100vw - 150px);

    max-height:
        calc(100vh - 150px);

    width:auto;

    height:auto;

    object-fit:contain;

    user-select:none;

    -webkit-user-drag:none;

    cursor:grab;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1);

    transform-origin:center;

    transition:
        transform .12s ease;
}

.lightbox-image.dragging{
    cursor:grabbing;

    transition:none;
}

/* =====================================================
   LIGHTBOX BUTTONS
===================================================== */

.lightbox-close{
    position:absolute;

    top:15px;

    right:17px;

    z-index:10;

    width:44px;

    height:44px;

    border:
        1px solid
        rgba(255,193,7,.45);

    border-radius:10px;

    background:rgba(10,10,10,.85);

    color:#fff;

    font-size:25px;

    cursor:pointer;

    transition:.2s;
}

.lightbox-close:hover{
    background:#ffc400;

    color:#050505;
}

.lightbox-arrow{
    position:absolute;

    top:50%;

    transform:translateY(-50%);

    z-index:10;

    width:48px;

    height:58px;

    border:
        1px solid
        rgba(255,193,7,.35);

    border-radius:10px;

    background:rgba(8,8,8,.78);

    color:#fff;

    font-size:28px;

    cursor:pointer;

    transition:.2s;
}

.lightbox-arrow:hover{
    background:#ffc400;

    color:#050505;
}

.lightbox-prev{
    left:14px;
}

.lightbox-next{
    right:14px;
}

/* =====================================================
   LIGHTBOX CONTROLS
===================================================== */

.lightbox-controls{
    position:absolute;

    left:50%;

    bottom:16px;

    transform:translateX(-50%);

    z-index:20;

    display:flex;

    align-items:center;

    padding:7px;

.side-overlay.open{

.side-menu-title{

/* =====================================================

===================================================== */

function isImage(name){

    const lower =
        name.toLowerCase();

    return imageExtensions.some(
        ext =>
            lower.endsWith(ext)
    );

}


function naturalSort(a,b){

    const aMatch =
        a.match(/(\d+)(?=\.[^.]+$)/);

    const bMatch =
        b.match(/(\d+)(?=\.[^.]+$)/);


    const aNumber =
        aMatch
        ?
        Number(aMatch[1])
        :
        Infinity;


    const bNumber =
        bMatch
        ?
        Number(bMatch[1])
        :
        Infinity;


    if(
        aNumber !== Infinity &&
        bNumber !== Infinity
    ){

        return aNumber - bNumber;

    }


    return a.localeCompare(
        b,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}

    count.className =
        "photo-count";


    count.textContent =
        `${files.length} фото`;


    titleLeft.appendChild(h2);

    title.appendChild(titleLeft);

    title.appendChild(count);

    section.appendChild(title);


    const gallery =
        document.createElement(
            "div"
        );


    gallery.className =
        "gallery";


    if(files.length === 0){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty";


        empty.textContent =
            "Пока нет фотографий этого раздела.";


        gallery.appendChild(empty);

    }


    files.forEach(
        (file,index)=>{

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "photo-card";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                file.download_url;


            img.alt =
                group.title +
                " — " +
                file.name;


            img.loading =
                "lazy";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "photo-number";


            number.textContent =
                file.name;


            card.appendChild(img);

            card.appendChild(number);


            card.addEventListener(
                "click",
                ()=>{
                    openLightbox(
                        files,
                        index
                    );
                }
            );


            gallery.appendChild(card);

        }
    );


    section.appendChild(gallery);

    return section;
}


/* =====================================================
   LOAD PHOTOS
===================================================== */

async function loadPhotos(){

    container.innerHTML = "";


    try{

        const response =
            await fetch(
                GITHUB_API,
                {
                    headers:{
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "GitHub API error: " +
                response.status
            );

        }


        const items =
            await response.json();


        const files =
            items.filter(
                item =>
                    item.type === "file" &&
                    isImage(item.name)
            );


        groups.forEach(
            group => {

                const groupFiles =
                    files
                    .filter(
                        file =>
                            file.name
                            .toLowerCase()
                            .startsWith(
                                group.prefix.toLowerCase()
                            )
                    )
                    .sort(
                        (a,b)=>
                            naturalSort(
                                a.name,
                                b.name
                            )
                    );


                const section =
                    createGuildSection(
                        group,
                        groupFiles
                    );


                container.appendChild(
                    section
                );

            }
        );

    }
    catch(error){

        console.error(error);


        groups.forEach(
            group=>{

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "guild-section";


                section.innerHTML = `

                    <div class="guild-title">

                        <div class="guild-title-left">

                            <h2>
                                <span>
                                    ${group.title}
                                </span>
                            </h2>

                        </div>

                    </div>


                    <div class="error">

                        Не удалось загрузить фотографии.
                        <br>
                        Проверь подключение к интернету
                        и доступность GitHub.

                    </div>

                `;


                container.appendChild(
                    section
                );

            }
        );

    }

}


/* =====================================================
   OPEN LIGHTBOX
===================================================== */

function openLightbox(
    images,
    index
){

    currentImages =
        images;

    currentIndex =
        index;


    zoom = 1;

    offsetX = 0;

    offsetY = 0;


    lightbox.classList.add(
        "open"
    );


    document.body.classList.add(
        "menu-open"
    );


    renderLightbox();


    lightboxImage.focus?.();

}


/* =====================================================
   CLOSE LIGHTBOX
===================================================== */

function closeLightbox(){

    lightbox.classList.remove(
        "open"
    );


    document.body.classList.remove(
        "menu-open"
    );


    resetTransform();

}


/* =====================================================
   RENDER LIGHTBOX
===================================================== */

function renderLightbox(){

    if(!currentImages.length){
        return;
    }


    const file =
        currentImages[
            currentIndex
        ];


    lightboxImage.src =
        file.download_url;


    lightboxImage.alt =
        file.name;


    lightboxCaption.textContent =
        descriptions[file.name] ||
        file.name;


    lightboxPrev.style.display =
        currentImages.length > 1
        ?
        "block"
        :
        "none";


    lightboxNext.style.display =
        currentImages.length > 1
        ?
        "block"
        :
        "none";


    resetTransform();

}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function nextImage(){

    if(
        currentImages.length <= 1
    ){
        return;
    }


    currentIndex =
        (
            currentIndex + 1
        )
        %
        currentImages.length;


    renderLightbox();

}


function previousImage(){

    if(
        currentImages.length <= 1
    ){
        return;
    }


    currentIndex =
        (
            currentIndex -
            1 +
            currentImages.length
        )
        %
        currentImages.length;


    renderLightbox();

}


/* =====================================================
   ZOOM
===================================================== */

function updateTransform(){

    lightboxImage.style.transform =
        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${zoom})`;


    zoomValue.textContent =
        Math.round(
            zoom * 100
        ) + "%";

}


function setZoom(
    newZoom
){

    zoom =
        Math.max(
            1,
            Math.min(
                5,
                newZoom
            )
        );


    if(zoom === 1){

        offsetX = 0;

        offsetY = 0;

    }


    updateTransform();

}


function resetTransform(){

    zoom = 1;

    offsetX = 0;

    offsetY = 0;

    updateTransform();

}


/* =====================================================
   ZOOM BUTTONS
===================================================== */

document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        ()=>{
            setZoom(
                zoom + .25
            );
        }
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        ()=>{
            setZoom(
                zoom - .25
            );
        }
    );


document
    .getElementById("zoomReset")
    .addEventListener(
        "click",
        ()=>{
            resetTransform();
        }
    );


/* =====================================================
   CLOSE
===================================================== */

document
    .getElementById("lightboxClose")
    .addEventListener(
        "click",
        closeLightbox
    );


/* =====================================================
   ARROWS
===================================================== */

lightboxPrev.addEventListener(
    "click",
    previousImage
);


lightboxNext.addEventListener(
    "click",
    nextImage
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            !lightbox.classList.contains(
                "open"
            )
        ){
            return;
        }


        if(e.key === "Escape"){

            closeLightbox();

        }


        if(e.key === "ArrowRight"){

            nextImage();

        }


        if(e.key === "ArrowLeft"){

            previousImage();

        }


        if(
            e.key === "+" ||
            e.key === "="
        ){

            setZoom(
                zoom + .25
            );

        }


        if(e.key === "-"){

            setZoom(
                zoom - .25
            );

        }


        if(e.key === "0"){

            resetTransform();

        }

    }
);


/* =====================================================
   MOUSE WHEEL ZOOM
===================================================== */

lightboxStage.addEventListener(
    "wheel",
    e=>{

        if(
            !lightbox.classList.contains(
                "open"
            )
        ){
            return;
        }


        e.preventDefault();


        if(e.deltaY < 0){

            setZoom(
                zoom + .15
            );

        }else{

            setZoom(
                zoom - .15
            );

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   DOUBLE CLICK ZOOM
===================================================== */

lightboxImage.addEventListener(
    "dblclick",
    ()=>{

        if(zoom === 1){

            setZoom(2);

        }else{

            resetTransform();

        }

    }
);


/* =====================================================
   DRAG / TOUCH
===================================================== */

lightboxImage.addEventListener(
    "pointerdown",
    e=>{

        pointerStartX =
            e.clientX;

        pointerStartY =
            e.clientY;


        startX =
            e.clientX;

        startY =
            e.clientY;


        dragStartX =
            offsetX;

        dragStartY =
            offsetY;


        if(zoom > 1){

            isDragging = true;

            lightboxImage.classList.add(
                "dragging"
            );

            lightboxImage.setPointerCapture(
                e.pointerId
            );

        }

    }
);


lightboxImage.addEventListener(
    "pointermove",
    e=>{

        if(!isDragging){
            return;
        }


        const dx =
            e.clientX -
            startX;


        const dy =
            e.clientY -
            startY;


        offsetX =
            dragStartX + dx;


        offsetY =
            dragStartY + dy;


        updateTransform();

    }
);


lightboxImage.addEventListener(
    "pointerup",
    e=>{

        const dx =
            e.clientX -
            pointerStartX;


        const dy =
            e.clientY -
            pointerStartY;


        if(isDragging){

            isDragging = false;

            lightboxImage.classList.remove(
                "dragging"
            );

        }


        /*
           Свайп работает только
           когда картинка не увеличена.
        */

        if(
            zoom === 1 &&
            Math.abs(dx) > 60 &&
            Math.abs(dx) > Math.abs(dy)
        ){

            if(dx < 0){

                nextImage();

            }else{

                previousImage();

            }

        }

    }
);


lightboxImage.addEventListener(
    "pointercancel",
    ()=>{
        isDragging = false;

        lightboxImage.classList.remove(
            "dragging"
        );
    }
);


/* =====================================================
   CLICK OUTSIDE IMAGE
===================================================== */

lightboxStage.addEventListener(
    "click",
    e=>{

        if(
            e.target ===
            lightboxStage
        ){

            closeLightbox();

        }

    }
);


/* =====================================================
   SIDE MENU
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );


const sideMenu =
    document.getElementById(
        "sideMenu"
    );


const sideOverlay =
    document.getElementById(
        "sideOverlay"
    );


function setMenu(open){

    menuButton.classList.toggle(
        "open",
        open
    );


    sideMenu.classList.toggle(
        "open",
        open
    );


    sideOverlay.classList.toggle(
        "open",
        open
    );


    /*
       Не блокируем прокрутку,
       когда открыт lightbox.
    */

    if(!lightbox.classList.contains("open")){

        document.body.classList.toggle(
            "menu-open",
            open
        );

    }


    menuButton.setAttribute(
        "aria-expanded",
        open
        ?
        "true"
        :
        "false"
    );


    sideMenu.setAttribute(
        "aria-hidden",
        open
        ?
        "false"
        :
        "true"
    );

}


menuButton.addEventListener(
    "click",
    ()=>{
        setMenu(
            !sideMenu.classList.contains(
                "open"
            )
        );
    }
);


sideOverlay.addEventListener(
    "click",
    ()=>{
        setMenu(false);
    }
);

   ACTIVE PAGE

    (

        "index.html"
    ).toLowerCase();
