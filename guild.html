<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2VN — Гильдия</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    color:#f2f2f2;

    background:#080808;

    min-height:100vh;

    overflow-x:hidden;
}

body::before{
    content:"";

    position:fixed;

    inset:0;

    z-index:-3;

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
}

body::after{
    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    background:rgba(0,0,0,.45);
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;

    top:0;

    z-index:1000;

    background:rgba(8,8,8,.94);

    border-bottom:1px solid rgba(255,193,7,.35);

    backdrop-filter:blur(12px);
}

.nav{
    width:min(1080px,92%);

    min-height:68px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#ff3030;
}

.nav-links{
    display:flex;
    gap:8px;
}

.nav-links a{
    color:#eee;

    text-decoration:none;

    font-size:14px;

    font-weight:800;

    padding:10px 14px;

    border-radius:9px;
}

.nav-links a:hover,
.nav-links a.active{
    background:#ffc400;

    color:#080808;
}

/* =====================================================
   MAIN
===================================================== */

main{
    width:min(1080px,92%);

    margin:auto;

    padding:42px 0 120px;
}

section{
    margin-bottom:34px;
}

.title{
    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;

    font-size:24px;

    font-weight:900;
}

.title::before{
    content:"";

    width:5px;
    height:27px;

    border-radius:5px;

    background:linear-gradient(
        #ff3030 0 50%,
        #ffc400 50%
    );
}

/* =====================================================
   GUILD BANNER — SMALL
===================================================== */

.guild-banner{

    width:min(700px,100%);

    height:230px;

    margin:0 auto;

    background:#050505;

    border:1px solid rgba(255,193,7,.45);

    border-radius:15px;

    overflow:hidden;

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);
}

.guild-banner img{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;
}

/* =====================================================
   GUILD INFO
===================================================== */

.guild-info{

    margin-top:15px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:9px;
}

.info{
    background:rgba(8,8,8,.88);

    border:1px solid #292929;

    border-radius:10px;

    padding:13px;

    text-align:center;
}

.info b{
    display:block;

    color:#ffc400;

    font-size:18px;

    margin-bottom:4px;
}

.info small{
    color:#999;

    font-size:11px;
}

/* =====================================================
   GUILD SCREENSHOT — SMALL
===================================================== */

.guild-screen-card{

    width:min(620px,100%);

    margin:0 auto;

    background:#050505;

    border:1px solid rgba(255,193,7,.35);

    border-radius:14px;

    overflow:hidden;
}

.guild-screen-card img{

    display:block;

    width:100%;

    height:auto;

    max-height:400px;

    object-fit:contain;
}

/* =====================================================
   PLAYERS
===================================================== */

.players{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:10px;
}

.player{

    background:rgba(8,8,8,.9);

    border:1px solid #292929;

    border-radius:11px;

    padding:14px;
}

.player-name{

    font-weight:900;

    margin-bottom:5px;
}

.player-name span{
    color:#ff3030;
}

.player p{

    color:#999;

    font-size:12px;
}

/* =====================================================
   BUTTON
===================================================== */

.guild-link{

    display:inline-block;

    margin-top:15px;

    padding:11px 17px;

    border-radius:9px;

    text-decoration:none;

    background:#ffc400;

    color:#080808;

    font-weight:900;

    transition:.2s;
}

.guild-link:hover{

    background:#ff3030;

    color:white;
}

/* =====================================================
   FIXED SOCIAL
===================================================== */

.social-bar{

    position:fixed;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    z-index:2000;

    display:flex;

    gap:8px;

    width:max-content;

    max-width:calc(100% - 24px);
}

.social-button{

    min-width:145px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:12px 17px;

    border-radius:10px;

    text-decoration:none;

    font-weight:900;

    font-size:13px;

    box-shadow:0 7px 25px rgba(0,0,0,.55);
}

.social-tiktok{

    background:#111;

    color:#fff;
}

.social-whatsapp{

    background:#ffc400;

    color:#080808;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .nav{
        min-height:60px;
    }

    .logo{
        font-size:18px;
    }

    .nav-links a{
        padding:8px;
        font-size:11px;
    }

    main{
        width:94%;

        padding-top:25px;

        padding-bottom:105px;
    }

    /* SMALL BANNER */

    .guild-banner{

        width:100%;

        height:145px;

        border-radius:11px;
    }

    .guild-info{

        grid-template-columns:repeat(2,1fr);

        gap:7px;
    }

    .info{

        padding:10px;
    }

    .info b{

        font-size:16px;
    }

    .guild-screen-card{

        width:100%;
    }

    .guild-screen-card img{

        max-height:300px;
    }

    .players{

        grid-template-columns:1fr 1fr;
    }

    .social-button{

        min-width:135px;

        padding:11px 12px;

        font-size:12px;
    }
}

@media(max-width:380px){

    .guild-banner{
        height:125px;
    }

    .players{
        grid-template-columns:1fr;
    }

    .social-button{

        min-width:125px;

        font-size:11px;
    }
}

</style>
</head>

<script>

</html>
